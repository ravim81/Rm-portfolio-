name: Cinematic world browser matrix
on:
  workflow_dispatch:
  push:
    branches: ["world-redesign/**"]
    paths: ["public/world/**","scripts/world-browser-audit.mjs",".github/workflows/world-browser-audit.yml"]
  pull_request:
    paths: ["public/world/**","scripts/world-browser-audit.mjs",".github/workflows/world-browser-audit.yml"]
permissions:
  contents: read
jobs:
  world-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/world-browser-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-world-browser-matrix
          path: test-results/world-browser-audit/
          retention-days: 7
          if-no-files-found: warn
