name: World scene browser audit
on:
  push:
    branches: ["world-redesign/**"]
    paths: ["public/world/**","scripts/world-browser-audit.mjs","tests/world-scene.test.mjs",".github/workflows/world-scene-audit.yml"]
  pull_request:
    paths: ["public/world/**","scripts/world-browser-audit.mjs","tests/world-scene.test.mjs",".github/workflows/world-scene-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Audit cinematic world across devices and browsers
        run: node scripts/world-browser-audit.mjs
      - name: Upload world scene screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-scene-browser-audit
          path: test-results/world-audit/
          if-no-files-found: warn
          retention-days: 7
