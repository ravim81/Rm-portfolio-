name: Live Cloudflare browser smoke
on:
  workflow_dispatch:
  # Check the deployed Worker even when no source files have changed.
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - 'scripts/live-smoke.mjs'
      - '.github/workflows/live-smoke.yml'
concurrency:
  group: portfolio-live-smoke
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deployed-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify public Cloudflare Worker in four browser contexts
        env:
          PORTFOLIO_URL: https://rm-portfolio-preview.mallaravikumar9618.workers.dev/
        run: node scripts/live-smoke.mjs
      - name: Upload live-site screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-smoke
          path: test-results/live-smoke/
          if-no-files-found: warn
          retention-days: 7
