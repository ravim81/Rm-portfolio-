name: Check portfolio
on: [push, pull_request]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - name: Publish built assets to isolated preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/world-redesign/open-world-react'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/world
          git commit -m "chore: publish open-world preview assets [skip ci]" || echo "No generated asset changes"
          git push --force origin HEAD:refs/heads/world-preview-assets
      - name: Deploy isolated Cloudflare preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/world-redesign/open-world-react'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npm run deploy
          else
            echo "::notice::Cloudflare deployment skipped because repository deployment secrets are not configured."
          fi
